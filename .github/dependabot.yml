version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /ai-sdk-express
      - /mastra-ai
      - /mcp-gateway-entra-obo
      - /mcp-gateway-token-exchange/gateway
      - /mcp-gateway-token-exchange/mock-github-mcp
      - /mcp-server-id-jag
      - /mcp-server-jwks-keycloak/mcp-server
      - /model-router-client-credentials
      - /model-router-user-oauth
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
