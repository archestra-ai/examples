services:
  platform:
    image: archestra/platform:latest
    ports:
      - "3000:3000"
      - "9000:9000"
    environment:
      - ARCHESTRA_QUICKSTART=true
      # If localhost doesn't work (e.g. OrbStack on macOS), uncomment and use 127.0.0.1:
      # - ARCHESTRA_FRONTEND_URL=http://127.0.0.1:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - archestra-postgres-data:/var/lib/postgresql/data
      - archestra-app-data:/app/data

volumes:
  archestra-postgres-data:
  archestra-app-data:
